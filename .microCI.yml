steps:
  - name: "Build diagrams via pikchr"
    description: "Build diagrams from textual description"
    plugin:
      name: "pikchr"
      source:
        - "book/images/*.pikchr"
      type: svg # svg | png | pdf
      output_folder: "book/images/"

  - name: "Generate HTML from Asciidoc"
    description: "Description of this step"
    plugin:
      name: skip # asciidoc
      output_format: html
      destination_dir: _book
      output: Gentle_Introduction_to_Embedded_Software_with_microCI.html
      input:
        - book/index.adoc

  - name: "Generate PDF from Asciidoc"
    description: "Description of this step"
    plugin:
      name: asciidoc
      output_format: pdf
      destination_dir: _book
      output: Gentle_Introduction_to_Embedded_Software_with_microCI.pdf
      input:
        - book/index.adoc

